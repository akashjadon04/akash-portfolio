<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="sfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="sfAnvil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="sfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0A1016" stroke="#162A38" stroke-width="1.5"/>

  <!-- Anvil / AST Compiler Tree Icon -->
  <g transform="translate(36, 22)">
    <!-- Branching Tree Nodes (AST) -->
    <circle cx="40" cy="16" r="6" fill="#10B981" filter="url(#sfGlow)" />
    <circle cx="20" cy="38" r="5" fill="#06B6D4" />
    <circle cx="60" cy="38" r="5" fill="#3B82F6" />
    <circle cx="34" cy="58" r="4.5" fill="#10B981" />
    <circle cx="46" cy="58" r="4.5" fill="#3B82F6" />

    <!-- Syntax Connectors -->
    <line x1="40" y1="16" x2="20" y2="38" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="16" x2="60" y2="38" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="38" x2="34" y2="58" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="38" x2="46" y2="58" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />

    <!-- Compiler Diamond Core -->
    <polygon points="40,28 48,38 40,48 32,38" fill="#0A1016" stroke="url(#sfGrad)" stroke-width="2" />
    <circle cx="40" cy="38" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="136" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="#F8FAFC">SCHEMA<tspan fill="url(#sfGrad)">FORGE</tspan></text>
  <text x="138" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.2" fill="#34D399">OFFLINE AST COMPILER &amp; CI/CD RUNNER FOR MAKE</text>

  <!-- Status Pill -->
  <g transform="translate(520, 42)">
    <rect width="168" height="34" rx="17" fill="#11222C" stroke="#1D4A5E" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#10B981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.8">473 TESTS PASSED</text>
  </g>
</svg>